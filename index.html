<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Tip</title>
    <link rel="stylesheet" href="../css/swiper.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00ff88;
            --secondary: #00ccff;
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Matrix background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.08;
        }

        /* Container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
        }

        /* Terminal Card */
        .card {
            position: relative;
            z-index: 1;
            width: calc(100% - 32px);
            max-width: 400px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            padding: 32px 24px;
            text-align: center;
        }

        /* Terminal Header */
        .terminal-header {
            background: rgba(0, 255, 136, 0.05);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            text-align: center;
        }

        .terminal-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            letter-spacing: 3px;
        }

        /* Terminal Body */
        .terminal-body {
            padding: 32px 24px;
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 22px;
        }

        .avatar-ring {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
            position: relative;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-dark);
            overflow: hidden;
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .online-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background: var(--primary);
            border: 2.5px solid var(--bg-dark);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .sub-label {
            font-size: 13px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
            margin-bottom: 28px;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            font-weight: 600;
            padding: 0 4px;
        }

        /* Details Button */
        .details-btn {
            padding: 4px 30px;
            background: transparent;
            border: 0px solid var(--text-dim);
            border-radius: 8px;
            color: var(--text-dim);
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
            margin-left: 12px;
            flex-shrink: 0;
        }

        .details-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(0px);
        }

        .details-btn i {
            font-size: 10px;
        }

        /* Channels/Buttons */
        .channels {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0;
            border-radius: 6px;
            text-decoration: none !important;
            color: var(--text) !important;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.2s ease;
            position: relative;
            background: var(--bg-card);
        }

        .btn:hover {
            background: rgba(0, 255, 136, 0.05);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn .icon-col {
            width: 52px;
            min-width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(0, 255, 136, 0.05);
            flex-shrink: 0;
        }

        .btn .text-col {
            flex: 1;
            padding: 0 14px;
            text-align: left;
        }

        .btn .btn-name {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
        }

        .btn .btn-desc {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-top: 2px;
            font-weight: 400;
        }

        .btn .arrow-col {
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .btn:hover .arrow-col {
            transform: translateX(3px);
            color: var(--primary);
        }

        .btn-tg-main {
            border-left: 3px solid var(--primary);
        }

        .btn-tg-spike {
            border-left: 3px solid var(--secondary);
        }

        .btn-tg-ff {
            border-left: 3px solid #ff3250;
        }

        .btn-discord {
            border-left: 3px solid #5865f2;
        }

        .btn-tg-main:hover,
        .btn-tg-spike:hover,
        .btn-tg-ff:hover,
        .btn-discord:hover {
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.2);
        }

        /* Footer */
        .foot {
            margin-top: 28px;
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .foot .heart {
            display: inline-block;
            color: var(--primary);
            animation: heartbeat 1.4s ease infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.3);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.15);
            }
        }

        /* Search Section */
        .search-section {
            margin-bottom: 22px;
        }

        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-size: 14px;
            font-family: 'Courier New', monospace;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        .search-input:focus {
            background: var(--bg-dark);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 255, 136, 0.12);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 14px;
            pointer-events: none;
        }

        .game-result {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .game-result.show {
            display: flex;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            transition: all 0.2s ease;
        }

        .game-item:hover {
            background: rgba(0, 255, 136, 0.05);
            border-color: var(--primary);
        }

        .game-image {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .game-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .game-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .game-meta {
            font-size: 11px;
            color: var(--text-dim);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            border-radius: 50%;
            text-decoration: none !important;
            transition: all 0.15s ease;
            flex-shrink: 0;
            box-shadow: none;
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--primary);
        }

        .download-btn:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 255, 136, 0.4);
        }

        .download-btn:hover svg {
            fill: var(--primary);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        .no-result {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--text-dim);
            font-size: 13px;
        }

        .no-result.show {
            display: block;
        }

        .marquee-section {
            margin: 4px 0 20px;
            overflow: hidden;
            position: relative;
        }

        .marquee-section::before,
        .marquee-section::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 32px;
            z-index: 2;
            pointer-events: none;
        }

        .marquee-section::before {
            left: 0;
            background: linear-gradient(to right, var(--card-bg), transparent);
        }

        .marquee-section::after {
            right: 0;
            background: linear-gradient(to left, var(--card-bg), transparent);
        }

        /* New Update - Manual scroll */
        .new-update-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            padding: 8px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .new-update-scroll::-webkit-scrollbar {
            display: none;
        }

        /* Featured - Auto scroll */
        .marquee-track {
            display: flex;
            gap: 10px;
            animation: marquee-scroll 30s linear infinite;
            -webkit-animation: marquee-scroll 30s linear infinite;
            animation-play-state: running;
            -webkit-animation-play-state: running;
            width: max-content;
            will-change: transform;
            -webkit-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
        }

        .marquee-track:hover {
            animation-play-state: paused;
            -webkit-animation-play-state: paused;
        }

        @-webkit-keyframes marquee-scroll {
            from {
                -webkit-transform: translate3d(0, 0, 0);
                transform: translate3d(0, 0, 0);
            }

            to {
                -webkit-transform: translate3d(-33.333%, 0, 0);
                transform: translate3d(-33.333%, 0, 0);
            }
        }

        @keyframes marquee-scroll {
            from {
                transform: translate3d(0, 0, 0);
            }

            to {
                transform: translate3d(-33.333%, 0, 0);
            }
        }

        .marquee-item {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: visible;
            border: 1.5px solid var(--game-item-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-decoration: none;
            position: relative;
        }

        .marquee-item:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
            border-color: var(--input-focus-border);
        }

        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 11px;
        }

        /* NEW Badge - Soft rounded style */
        .new-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            padding: 2px 7px 3px;
            background: linear-gradient(135deg, #2172cb 0%, #de4040 100%);
            border-radius: 10px;
            font-size: 9px;
            font-weight: 600;
            color: #ffffff;
            text-transform: lowercase;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 12px rgba(139, 92, 246, 0.5),
                0 0 0 2px var(--card-bg);
            z-index: 10;
            animation: glow-badge 2s ease-in-out infinite;
            line-height: 1.1;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Rounded', 'Segoe UI', 'Avenir Next Rounded', sans-serif;
        }

        [data-theme="dark"] .new-badge {
            background: linear-gradient(135deg, #2172cb 0%, #de4040 100%);
            box-shadow: 0 2px 16px rgba(167, 139, 250, 0.6),
                0 0 0 2px var(--card-bg);
        }

        @keyframes glow-badge {

            0%,
            100% {
                box-shadow: 0 2px 12px rgba(139, 92, 246, 0.5),
                    0 0 0 2px var(--card-bg);
            }

            50% {
                box-shadow: 0 4px 20px rgba(139, 92, 246, 0.8),
                    0 0 0 2px var(--card-bg),
                    0 0 20px rgba(139, 92, 246, 0.4);
            }
        }

        .no-result {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--no-result);
            font-size: 13px;
        }

        .no-result.show {
            display: block;
        }

        /* Marquee Section */
        .marquee-section {
            margin: 4px 0 20px;
            overflow: hidden;
            position: relative;
        }

        .marquee-section::before,
        .marquee-section::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 32px;
            z-index: 2;
            pointer-events: none;
        }

        .marquee-section::before {
            left: 0;
            background: linear-gradient(to right, var(--bg-card), transparent);
        }

        .marquee-section::after {
            right: 0;
            background: linear-gradient(to left, var(--bg-card), transparent);
        }

        .new-update-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-behavior: smooth;
            padding: 8px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .new-update-scroll::-webkit-scrollbar {
            display: none;
        }

        .marquee-track {
            display: flex;
            gap: 10px;
            animation: marquee-scroll 30s linear infinite;
            width: max-content;
            will-change: transform;
        }

        .marquee-track:hover {
            animation-play-state: paused;
        }

        @keyframes marquee-scroll {
            from {
                transform: translate3d(0, 0, 0);
            }

            to {
                transform: translate3d(-33.333%, 0, 0);
            }
        }

        .marquee-item {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            overflow: visible;
            border: 1.5px solid var(--border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-decoration: none;
            position: relative;
        }

        .marquee-item:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 6px 16px rgba(0, 255, 136, 0.3);
            border-color: var(--primary);
        }

        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 7px;
        }

        .new-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            padding: 2px 7px 3px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
            font-size: 9px;
            font-weight: 600;
            color: var(--bg-dark);
            text-transform: lowercase;
            letter-spacing: 0.3px;
            box-shadow: 0 2px 12px rgba(0, 255, 136, 0.5), 0 0 0 2px var(--bg-card);
            z-index: 10;
            animation: glow-badge 2s ease-in-out infinite;
            line-height: 1.1;
            font-family: 'Courier New', monospace;
        }

        @keyframes glow-badge {

            0%,
            100% {
                box-shadow: 0 2px 12px rgba(0, 255, 136, 0.5), 0 0 0 2px var(--bg-card);
            }

            50% {
                box-shadow: 0 4px 20px rgba(0, 255, 136, 0.8), 0 0 0 2px var(--bg-card), 0 0 20px rgba(0, 255, 136, 0.4);
            }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal-content {
            position: relative;
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            animation: slideUp 0.3s ease;
            overflow: hidden;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--btn-bg);
            border: 1px solid var(--btn-border);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
            transform: rotate(90deg);
        }

        .carousel-container {
            position: relative;
            overflow: hidden;
        }

        .swiper {
            width: 100%;
            height: 100%;
        }

        .swiper-slide {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .carousel-game-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--game-item-bg);
            border: 1px solid var(--game-item-border);
            border-radius: 14px;
            padding: 10px 12px;
            transition: all 0.2s ease;
            cursor: default;
        }

        .carousel-game-card:hover {
            background: var(--game-item-hover-bg);
            border-color: var(--game-item-hover-border);
            transform: translateX(4px);
        }

        .carousel-download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .carousel-download-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--primary);
        }

        .carousel-download-btn:hover {
            background: rgba(0, 255, 136, 0.1);
            transform: scale(1.1);
        }

        .carousel-download-btn:hover svg {
            fill: var(--primary);
        }

        .carousel-game-image {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .carousel-game-info {
            flex: 1;
            min-width: 0;
        }

        .carousel-game-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .carousel-game-meta {
            font-size: 11px;
            color: var(--text-dim);
        }

        .swiper-button-next,
        .swiper-button-prev {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-dim);
            transition: all 0.2s ease;
        }

        .swiper-button-next:after,
        .swiper-button-prev:after {
            font-size: 16px;
        }

        .swiper-button-next:hover,
        .swiper-button-prev:hover {
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--primary);
        }

        .swiper-pagination-bullet {
            width: 8px;
            height: 8px;
            background: var(--border);
            opacity: 1;
            transition: all 0.2s ease;
        }

        .swiper-pagination-bullet-active {
            background: var(--primary);
            width: 24px;
            border-radius: 4px;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {
            .modal-content {
                width: 95%;
                padding: 20px 16px;
            }
        }
    </style>
    <script src="../js/data.js"></script>
</head>

<body>
    <!-- Matrix Background -->
    <canvas id="matrix-canvas"></canvas>

    <!-- Card -->
    <div class="card">

        <!-- Avatar -->
        <div class="avatar-wrap">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <img src="https://raw.githubusercontent.com/tiptipios/chanthuhoi/main/index/Photoroom_20251110_234059_processed.png"
                        alt="Tip Tip">
                </div>
            </div>
            <div class="online-dot"></div>
        </div>

        <!-- Name -->
        <h1>Tip Tip</h1>
        <p class="sub-label"> </p>

        <!-- Search Section -->
        <div class="search-section">
            <div class="divider"><span>Search iOS Games</span></div>

            <div class="search-box">
                <input type="text" class="search-input" id="gameSearch" placeholder="Enter game name..."
                    autocomplete="off">
                <i class="fas fa-search search-icon"></i>
            </div>

            <div class="game-result" id="gameResult">
                <!-- Game items will be inserted here dynamically -->
            </div>

            <div class="no-result" id="noResult">
                <i class="fas fa-search" style="font-size: 24px; margin-bottom: 8px; opacity: 0.3;"></i>
                <div>No games found</div>
            </div>
        </div>

        <!-- New Update Games Marquee -->
        <div class="marquee-section">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;">
                <div class="divider" style="flex: 1; margin-bottom: 0;     padding-left: 80px;">
                    <span>🔥 New Updates</span>
                </div>
                <button class="details-btn" onclick="openModal('new')">
                    Chi tiết
                </button>
            </div>
            <div class="new-update-scroll" id="newUpdateTrack">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Featured Games Marquee -->
        <div class="marquee-section">
            <div class="divider">
                <span>⭐ Featured Games</span>
            </div>
            <div class="marquee-track" id="marqueeTrack">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Divider -->
        <div class="divider"><span>Join Our Channels</span></div>

        <!-- Channels -->
        <div class="channels">

            <a href="https://t.me/gamemodios" class="btn btn-tg-main" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name"> Telegram Channel</span>
                    <span class="btn-desc">Games, Apps, IPA </span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://t.me/modspike" class="btn btn-tg-spike" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name">The Spike Channel</span>
                    <span class="btn-desc">The Spike Cross</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://t.me/freefiretiptip" class="btn btn-tg-ff" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name">FreeFire Channel</span>
                    <span class="btn-desc">Free Fire Updates</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://discord.gg/p7P4KqhPZg" class="btn btn-discord" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-discord"></i></div>
                <div class="text-col">
                    <span class="btn-name">Discord</span>
                    <span class="btn-desc">Join our community</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

        </div>

        <!-- Footer -->
        <p class="foot">Made with <span class="heart">♥</span> by Tip Tip · 2026</p>

    </div>

    <!-- Modal Carousel -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Game Details</h2>
                <button class="modal-close" onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="carousel-container">
                <div class="swiper" id="modalSwiper">
                    <div class="swiper-wrapper">
                        <!-- Slides will be generated by JS -->
                    </div>
                    <div class="swiper-pagination"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../asset/js/swiper.min.js"></script>

    <script>
        const searchInput = document.getElementById('gameSearch');
        const gameResult = document.getElementById('gameResult');
        const noResult = document.getElementById('noResult');

        // Pre-build lowercase title index for fast lookup
        const gamedataIndexed = data.map(g => ({
            ...g,
            _title_lc: g.title.toLowerCase()
        }));

        let debounceTimer = null;
        let lastQuery = '';

        function buildGameCard(game) {
            const downloadUrl = `download.html?title=${encodeURIComponent(game.title)}&image=${encodeURIComponent(game.image)}&description=${encodeURIComponent(game.description || '')}&version=${encodeURIComponent(game.version)}&size=${encodeURIComponent(game.size)}&url=${encodeURIComponent(game.download_url)}`;

            const div = document.createElement('div');
            div.className = 'game-item';
            div.innerHTML = `
                <img src="${game.image}" alt="${game.title}" class="game-image" loading="lazy" onerror="this.src='https://via.placeholder.com/80'">
                <div class="game-info">
                    <div class="game-title">${game.title}</div>
                    <div class="game-meta">v${game.version} • ${game.size}</div>
                </div>
                <a href="${downloadUrl}" class="download-btn" title="Download">
                    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M691.3 693.9c-24.7 0-44.8-20-44.8-44.8 0-24.7 20-44.8 44.8-44.8h40c190.6 0 176.8-274.4 0.2-268.1C671.2 37.2 208 145.1 299 445c-93-73.9-204.6 69.2-109.6 139.8 67.2 49.9 188.5-18.4 188.5 64.3 0 56.3-63.9 44.8-125.3 44.8-149.3 0-241.3-159.3-155.8-281.1 40.8-58.2 104.9-72.6 104.9-72.6C231.4 111.3 492.7-9.5 686.2 120c83.1 55.6 114.5 136.9 114.5 136.9 48.8 14.8 90.7 45.6 119.2 86.4 96 137.3 21.5 350.6-228.6 350.6zM514.2 335.8c0.2 0 0.3 0.1 0.5 0.1s0.3-0.1 0.5-0.1h-1z m177.1 421.1c0-17.5-45.8-17.3-63.3 0.1l-32.8 32.9c-14.1 14.1-38.2 4.2-38.2-15.8V380.6c0-24.5-17.9-44.4-42.3-44.7-24.5 0.3-47.2 20.1-47.2 44.7v393.5c0 19.9-24.1 29.9-38.2 15.8l-32.8-42.1c-17.5-17.5-45.3-9.3-62.8-9.3h-0.2c-17.5 44.8-17.6 55.1-0.1 72.6L449 931.5c35 35 91.6 37.3 126.6 2.3l115.7-114.6c17.5-17.5 0-45.2 0-62.7v0.4z"/></svg>
                </a>
            `;
            return div;
        }

        function doSearch(term) {
            if (term === lastQuery) return;
            lastQuery = term;

            if (term === '') {
                gameResult.classList.remove('show');
                noResult.classList.remove('show');
                gameResult.innerHTML = '';
                return;
            }

            const found = gamedataIndexed.filter(g => g._title_lc.includes(term));

            if (found.length > 0) {
                // Use DocumentFragment to batch DOM writes
                const frag = document.createDocumentFragment();
                found.forEach(g => frag.appendChild(buildGameCard(g)));
                gameResult.innerHTML = '';
                gameResult.appendChild(frag);
                gameResult.classList.add('show');
                noResult.classList.remove('show');
            } else {
                gameResult.classList.remove('show');
                gameResult.innerHTML = '';
                noResult.classList.add('show');
            }
        }

        searchInput.addEventListener('input', function () {
            const term = this.value.trim().toLowerCase();
            clearTimeout(debounceTimer);
            // Debounce: wait 200ms after user stops typing
            debounceTimer = setTimeout(() => doSearch(term), 200);
        });

        // ── NEW UPDATE MARQUEE (8 latest games) ──
        const newUpdateTrack = document.getElementById('newUpdateTrack');

        // Get 8 newest games from data (sorted by updated_at descending)
        const sortedByDate = [...data].sort((a, b) => {
            const dateA = new Date(a.updated_at || '2000-01-01');
            const dateB = new Date(b.updated_at || '2000-01-01');
            return dateB - dateA; // newest first
        });

        // Take top 8 newest games (no filtering)
        const newGames = sortedByDate.slice(0, 8);

        // Build new update marquee with badge (no duplicate, manual scroll)
        const buildNewUpdateItems = () => {
            const frag = document.createDocumentFragment();
            // No duplicate - user scrolls manually
            newGames.forEach(game => {
                const btn = document.createElement('button');
                btn.className = 'marquee-item';
                btn.title = game.title;
                btn.style.background = 'none';
                btn.style.cursor = 'pointer';
                btn.innerHTML = `
                    <span class="new-badge">new</span>
                    <img src="${game.image}" alt="${game.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/48'">
                `;
                btn.addEventListener('click', () => {
                    searchInput.value = game.title;
                    searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    lastQuery = '';
                    doSearch(game.title.toLowerCase());
                });
                frag.appendChild(btn);
            });
            newUpdateTrack.appendChild(frag);
        };
        buildNewUpdateItems();

        // ── FEATURED MARQUEE ──
        const marqueeTrack = document.getElementById('marqueeTrack');
        // Use featured array, fallback to data if empty
        const marqueeSource = (typeof featured !== 'undefined' && featured.length > 0) ? featured : data.slice(0, 20);

        // Build items x3 for seamless loop
        const buildFeaturedItems = () => {
            const frag = document.createDocumentFragment();
            // x3 for seamless loop (move 33.333% instead of 50%)
            [...marqueeSource, ...marqueeSource, ...marqueeSource].forEach(game => {
                const btn = document.createElement('button');
                btn.className = 'marquee-item';
                btn.title = game.title;
                btn.style.background = 'none';
                btn.style.cursor = 'pointer';
                btn.innerHTML = `<img src="${game.image}" alt="${game.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/48'">`;
                btn.addEventListener('click', () => {
                    searchInput.value = game.title;
                    searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    lastQuery = '';
                    doSearch(game.title.toLowerCase());
                });
                frag.appendChild(btn);
            });
            marqueeTrack.appendChild(frag);
        };
        buildFeaturedItems();

        // ── FIX iOS ANIMATION ──
        // iOS Safari pauses animations until user interaction — force restart
        function restartAnimation(element) {
            if (!element) return;
            element.style.animationPlayState = 'paused';
            element.style.webkitAnimationPlayState = 'paused';
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    element.style.animationPlayState = 'running';
                    element.style.webkitAnimationPlayState = 'running';
                });
            });
        }

        // Only restart Featured marquee (not New Update)
        restartAnimation(marqueeTrack);

        // Modal Swiper
        let modalSwiper = null;

        function openModal(type) {
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const swiperWrapper = document.querySelector('#modalSwiper .swiper-wrapper');

            // Determine which games to show
            let gamesToShow = [];
            if (type === 'new') {
                modalTitle.textContent = '🔥 New Updates';
                gamesToShow = data.slice(0, 30);
            } else {
                modalTitle.textContent = '⭐ Featured Games';
                gamesToShow = data.slice(30, 60);
            }

            // Clear existing slides
            swiperWrapper.innerHTML = '';

            // Create slides (5 games per slide)
            const gamesPerSlide = 5;
            for (let i = 0; i < gamesToShow.length; i += gamesPerSlide) {
                const slide = document.createElement('div');
                slide.className = 'swiper-slide';

                const slideGames = gamesToShow.slice(i, i + gamesPerSlide);

                slideGames.forEach(game => {
                    const downloadUrl = `download.html?title=${encodeURIComponent(game.title)}&image=${encodeURIComponent(game.image)}&description=${encodeURIComponent(game.description || '')}&version=${encodeURIComponent(game.version)}&size=${encodeURIComponent(game.size)}&url=${encodeURIComponent(game.download_url)}`;

                    const gameCard = document.createElement('div');
                    gameCard.className = 'carousel-game-card';
                    gameCard.innerHTML = `
                        <img src="${game.image}" alt="${game.title}" class="carousel-game-image" loading="lazy" onerror="this.src='https://via.placeholder.com/48'">
                        <div class="carousel-game-info">
                            <div class="carousel-game-title">${game.title}</div>
                            <div class="carousel-game-meta">v${game.version || 'N/A'} • ${game.size || 'N/A'}</div>
                        </div>
                        <a href="${downloadUrl}" class="carousel-download-btn" title="Download ${game.title}" onclick="event.stopPropagation()">
                            <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M691.3 693.9c-24.7 0-44.8-20-44.8-44.8 0-24.7 20-44.8 44.8-44.8h40c190.6 0 176.8-274.4 0.2-268.1C671.2 37.2 208 145.1 299 445c-93-73.9-204.6 69.2-109.6 139.8 67.2 49.9 188.5-18.4 188.5 64.3 0 56.3-63.9 44.8-125.3 44.8-149.3 0-241.3-159.3-155.8-281.1 40.8-58.2 104.9-72.6 104.9-72.6C231.4 111.3 492.7-9.5 686.2 120c83.1 55.6 114.5 136.9 114.5 136.9 48.8 14.8 90.7 45.6 119.2 86.4 96 137.3 21.5 350.6-228.6 350.6zM514.2 335.8c0.2 0 0.3 0.1 0.5 0.1s0.3-0.1 0.5-0.1h-1z m177.1 421.1c0-17.5-45.8-17.3-63.3 0.1l-32.8 32.9c-14.1 14.1-38.2 4.2-38.2-15.8V380.6c0-24.5-17.9-44.4-42.3-44.7-24.5 0.3-47.2 20.1-47.2 44.7v393.5c0 19.9-24.1 29.9-38.2 15.8l-32.8-42.1c-17.5-17.5-45.3-9.3-62.8-9.3h-0.2c-17.5 44.8-17.6 55.1-0.1 72.6L449 931.5c35 35 91.6 37.3 126.6 2.3l115.7-114.6c17.5-17.5 0-45.2 0-62.7v0.4z"/></svg>
                        </a>
                    `;
                    slide.appendChild(gameCard);
                });

                swiperWrapper.appendChild(slide);
            }

            // Show modal
            modalOverlay.classList.add('show');
            document.body.style.overflow = 'hidden';

            // Initialize or update Swiper
            if (modalSwiper) {
                modalSwiper.destroy(true, true);
            }

            modalSwiper = new Swiper('#modalSwiper', {
                slidesPerView: 1,
                spaceBetween: 16,
                navigation: false,
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true,
                },
                loop: false,
                autoplay: {
                    delay: 4000,
                    disableOnInteraction: false,
                }
            });
        }

        function closeModal() {
            const modalOverlay = document.getElementById('modalOverlay');
            modalOverlay.classList.remove('show');
            document.body.style.overflow = '';

            if (modalSwiper) {
                modalSwiper.autoplay.stop();
            }
        }

        // Close modal when clicking overlay
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        });

        // Close modal with Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Matrix background
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 17, 23, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff88';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 80);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>

</body>

</html>
