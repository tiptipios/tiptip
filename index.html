<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Tip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── THEME VARIABLES ── */
        :root {
            /* Light mode — trắng sạch, accent xanh dương */
            --bg: #f0f4ff;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-border: rgba(99, 102, 241, 0.15);
            --card-shadow: 0 20px 60px rgba(99, 102, 241, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --divider: rgba(99, 102, 241, 0.12);
            --input-bg: #f8fafc;
            --input-border: #e2e8f0;
            --input-focus-border: #6366f1;
            --input-color: #0f172a;
            --input-placeholder: #94a3b8;
            --btn-bg: #ffffff;
            --btn-border: #e2e8f0;
            --btn-hover-bg: #f8faff;
            --btn-hover-border: #c7d2fe;
            --btn-name: #0f172a;
            --btn-desc: #64748b;
            --btn-arrow: #cbd5e1;
            --btn-icon-bg: #f1f5f9;
            --game-item-bg: #ffffff;
            --game-item-border: #e2e8f0;
            --game-item-hover-bg: #f8faff;
            --game-item-hover-border: #c7d2fe;
            --game-title: #0f172a;
            --game-meta: #64748b;
            --dl-btn-bg: #6366f1;
            --dl-btn-border: #6366f1;
            --dl-btn-icon: #ffffff;
            --dl-btn-hover-bg: #4f46e5;
            --no-result: #94a3b8;
            --footer: #cbd5e1;
            --online-border: #f0f4ff;
            --orb-color: #6366f1;
            --shine: rgba(255, 255, 255, 0.9);
            --toggle-bg: #ffffff;
            --toggle-border: #e2e8f0;
            --toggle-icon: #6366f1;
            --accent: #6366f1;
        }

        [data-theme="dark"] {
            /* Dark mode — đen sâu, accent tím sáng */
            --bg: #09090b;
            --card-bg: rgba(24, 24, 27, 0.95);
            --card-border: rgba(139, 92, 246, 0.25);
            --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(139, 92, 246, 0.1);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --divider: rgba(139, 92, 246, 0.2);
            --input-bg: #18181b;
            --input-border: #3f3f46;
            --input-focus-border: #8b5cf6;
            --input-color: #fafafa;
            --input-placeholder: #52525b;
            --btn-bg: #18181b;
            --btn-border: #3f3f46;
            --btn-hover-bg: #27272a;
            --btn-hover-border: #8b5cf6;
            --btn-name: #fafafa;
            --btn-desc: #71717a;
            --btn-arrow: #3f3f46;
            --btn-icon-bg: #27272a;
            --game-item-bg: #18181b;
            --game-item-border: #3f3f46;
            --game-item-hover-bg: #27272a;
            --game-item-hover-border: #8b5cf6;
            --game-title: #fafafa;
            --game-meta: #71717a;
            --dl-btn-bg: #8b5cf6;
            --dl-btn-border: #8b5cf6;
            --dl-btn-icon: #ffffff;
            --dl-btn-hover-bg: #7c3aed;
            --no-result: #52525b;
            --footer: #3f3f46;
            --online-border: #09090b;
            --orb-color: #8b5cf6;
            --shine: rgba(139, 92, 246, 0.15);
            --toggle-bg: #27272a;
            --toggle-border: #3f3f46;
            --toggle-icon: #a78bfa;
            --accent: #8b5cf6;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            background: var(--bg);
            padding: 20px 0;
            transition: background 0.3s ease;
        }

        /* ── TOGGLE BUTTON ── */
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--toggle-icon);
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            background: var(--btn-hover-bg);
        }

        /* ── LIQUID GLASS BACKGROUND ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* Liquid Glass floating bubbles */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            animation: float-liquid 25s linear infinite;
            will-change: transform;
            pointer-events: none;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--orb-color);
            top: -150px;
            left: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--orb-color);
            bottom: -100px;
            right: -60px;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: var(--orb-color);
            top: 40%;
            left: 60%;
            animation-duration: 22s;
        }

        .orb-4 {
            display: none;
        }

        @keyframes float-liquid {
            0% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(30px, -25px);
            }

            66% {
                transform: translate(-20px, 20px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* Glass reflection effect */
        .grid-lines {
            display: none;
        }

        /* ── LIQUID GLASS CARD ── */
        .card {
            position: relative;
            z-index: 1;
            width: calc(100% - 32px);
            max-width: 400px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 28px;
            padding: 40px 24px 36px;
            text-align: center;
            box-shadow: var(--card-shadow);
            animation: rise 0.5s cubic-bezier(.22, 1, .36, 1) both;
            overflow: hidden;
            will-change: transform;
            transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* top shine line */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--shine), transparent);
            pointer-events: none;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Card glow - static, no animation */
        .card::after {
            content: '';
            position: absolute;
            inset: -1px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08),
                    transparent 60%);
            border-radius: 28px;
            z-index: -1;
            pointer-events: none;
        }

        /* ── LIQUID GLASS AVATAR ── */
        .avatar-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 22px;
        }

        .avatar-ring {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* Liquid outer glow */
        .avatar-ring::before {
            display: none;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #1a1a1a;
            overflow: hidden;
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .online-dot {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background: #22c55e;
            border: 2.5px solid var(--bg);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.7);
            animation: liquid-ping 2s ease-in-out infinite;
        }

        @keyframes liquid-ping {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            transition: color 0.3s ease;
        }

        .sub-label {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 28px;
        }

        /* ── LIQUID DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--divider);
        }

        .divider span {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
            font-weight: 600;
            padding: 0 4px;
        }

        /* ── LIQUID GLASS BUTTONS ── */
        .channels {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0;
            border-radius: 16px;
            text-decoration: none !important;
            color: var(--btn-name) !important;
            border: 1px solid var(--btn-border);
            overflow: hidden;
            transition: all 0.2s ease;
            position: relative;
            background: var(--btn-bg);
        }

        .btn:hover {
            background: var(--btn-hover-bg);
            border-color: var(--btn-hover-border);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::before {
            display: none;
        }

        .btn::after {
            display: none;
        }

        .btn .icon-col {
            width: 52px;
            min-width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: var(--btn-icon-bg);
            flex-shrink: 0;
        }

        .btn .text-col {
            flex: 1;
            padding: 0 14px;
            text-align: left;
        }

        .btn .btn-name {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--btn-name);
            line-height: 1.3;
        }

        .btn .btn-desc {
            display: block;
            font-size: 11px;
            color: var(--btn-desc);
            margin-top: 2px;
            font-weight: 400;
        }

        .btn .arrow-col {
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--btn-arrow);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .btn:hover .arrow-col {
            transform: translateX(3px);
            color: var(--btn-desc);
        }

        .btn-tg-main {
            border-left: 3px solid rgba(0, 180, 255, 0.6);
        }

        .btn-tg-spike {
            border-left: 3px solid rgba(130, 80, 255, 0.6);
        }

        .btn-tg-ff {
            border-left: 3px solid rgba(255, 50, 80, 0.6);
        }

        .btn-discord {
            border-left: 3px solid rgba(88, 101, 242, 0.6);
        }

        .btn-tg-main:hover,
        .btn-tg-spike:hover,
        .btn-tg-ff:hover,
        .btn-discord:hover {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        /* ── LIQUID FOOTER ── */
        .foot {
            margin-top: 28px;
            font-size: 11px;
            color: var(--footer);
            font-weight: 500;
        }

        .foot .heart {
            display: inline-block;
            color: #f43f5e;
            animation: liquid-hb 1.4s ease infinite;
        }

        @keyframes liquid-hb {

            0%,
            100% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.3);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.15);
            }
        }

        /* ── SEARCH CARD ── */
        .search-section {
            margin-bottom: 22px;
        }

        .search-box {
            position: relative;
            margin-bottom: 14px;
        }

        .search-input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            color: var(--input-color);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--input-placeholder);
        }

        .search-input:focus {
            background: var(--input-bg);
            border-color: var(--input-focus-border);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--input-placeholder);
            font-size: 14px;
            pointer-events: none;
        }

        .game-result {
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .game-result.show {
            display: flex;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--game-item-bg);
            border: 1px solid var(--game-item-border);
            border-radius: 16px;
            padding: 10px 12px;
            transition: all 0.2s ease;
        }

        .game-item:hover {
            background: var(--game-item-hover-bg);
            border-color: var(--game-item-hover-border);
        }

        .game-image {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .game-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .game-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--game-title);
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .game-meta {
            font-size: 11px;
            color: var(--game-meta);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--dl-btn-bg);
            border: 1px solid var(--dl-btn-border);
            border-radius: 50%;
            text-decoration: none !important;
            transition: all 0.15s ease;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
        }

        .download-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--dl-btn-icon);
        }

        .download-btn:hover {
            background: var(--dl-btn-hover-bg);
            border-color: var(--dl-btn-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        /* ── GAME MARQUEE ── */
        .marquee-section {
            margin: 4px 0 20px;
            overflow: hidden;
            position: relative;
        }

        .marquee-section::before,
        .marquee-section::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 32px;
            z-index: 2;
            pointer-events: none;
        }

        .marquee-section::before {
            left: 0;
            background: linear-gradient(to right, var(--card-bg), transparent);
        }

        .marquee-section::after {
            right: 0;
            background: linear-gradient(to left, var(--card-bg), transparent);
        }

        .marquee-track {
            display: flex;
            gap: 10px;
            animation: marquee-scroll 22s linear infinite;
            width: max-content;
        }

        .marquee-track:hover {
            animation-play-state: paused;
        }

        @keyframes marquee-scroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .marquee-item {
            flex-shrink: 0;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            overflow: hidden;
            border: 1.5px solid var(--game-item-border);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-decoration: none;
        }

        .marquee-item:hover {
            transform: translateY(-3px) scale(1.08);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
            border-color: var(--input-focus-border);
        }

        .marquee-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .no-result {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--no-result);
            font-size: 13px;
        }

        .no-result.show {
            display: block;
        }
    </style>
    <script src="../js/data.js"></script>
</head>

<body>

    <!-- Background -->
    <div class="bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="grid-lines"></div>
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <i class="fas fa-sun" id="themeIcon"></i>
    </button>

    <!-- Card -->
    <div class="card">

        <!-- Avatar -->
        <div class="avatar-wrap">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <img src="https://bio.linkcdn.cc/upload/2024040505/171229360600038148.jpg" alt="Tip Tip">
                </div>
            </div>
            <div class="online-dot"></div>
        </div>

        <!-- Name -->
        <h1>Tip Tip</h1>
        <p class="sub-label"> </p>

        <!-- Search Section -->
        <div class="search-section">
            <div class="divider"><span>Search iOS Games</span></div>

            <div class="search-box">
                <input type="text" class="search-input" id="gameSearch" placeholder="Enter game name..."
                    autocomplete="off">
                <i class="fas fa-search search-icon"></i>
            </div>

            <div class="game-result" id="gameResult">

            </div>

            </div>

        <!-- Featured Games Marquee -->
        <div class="marquee-section">
            <div class="marquee-track" id="marqueeTrack">
                <!-- Filled by JS -->
            </div>
        </div>

        <!-- Divider -->
        <div class="divider"><span>Join Our Channels</span></div>

        <!-- Channels -->
        <div class="channels">

            <a href="https://t.me/gamemodios" class="btn btn-tg-main" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name"> Telegram Channel</span>
                    <span class="btn-desc">Games, Apps, IPA </span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://t.me/modspike" class="btn btn-tg-spike" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name">The Spike Channel</span>
                    <span class="btn-desc">The Spike Cross</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://t.me/freefiretiptip" class="btn btn-tg-ff" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name">FreeFire Channel</span>
                    <span class="btn-desc">Free Fire Updates</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://discord.gg/p7P4KqhPZg" class="btn btn-discord" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-discord"></i></div>
                <div class="text-col">
                    <span class="btn-name">Discord</span>
                    <span class="btn-desc">Join our community</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

        </div>

        <!-- Footer -->
        <p class="foot">Made with <span class="heart">♥</span> by Tip Tip · 2026</p>

    </div>

    <script>
        const searchInput = document.getElementById('gameSearch');
        const gameResult = document.getElementById('gameResult');
        const noResult = document.getElementById('noResult');

        // Pre-build lowercase title index for fast lookup
        const gamedataIndexed = data.map(g => ({
            ...g,
            _title_lc: g.title.toLowerCase()
        }));

        let debounceTimer = null;
        let lastQuery = '';

        function buildGameCard(game) {
            const downloadUrl = `download.html?title=${encodeURIComponent(game.title)}&image=${encodeURIComponent(game.image)}&description=${encodeURIComponent(game.description || '')}&version=${encodeURIComponent(game.version)}&size=${encodeURIComponent(game.size)}&url=${encodeURIComponent(game.download_url)}`;

            const div = document.createElement('div');
            div.className = 'game-item';
            div.innerHTML = `
                <img src="${game.image}" alt="${game.title}" class="game-image" loading="lazy" onerror="this.src='https://via.placeholder.com/80'">
                <div class="game-info">
                    <div class="game-title">${game.title}</div>
                    <div class="game-meta">v${game.version} • ${game.size}</div>
                </div>
                <a href="${downloadUrl}" class="download-btn" title="Download">
                    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M691.3 693.9c-24.7 0-44.8-20-44.8-44.8 0-24.7 20-44.8 44.8-44.8h40c190.6 0 176.8-274.4 0.2-268.1C671.2 37.2 208 145.1 299 445c-93-73.9-204.6 69.2-109.6 139.8 67.2 49.9 188.5-18.4 188.5 64.3 0 56.3-63.9 44.8-125.3 44.8-149.3 0-241.3-159.3-155.8-281.1 40.8-58.2 104.9-72.6 104.9-72.6C231.4 111.3 492.7-9.5 686.2 120c83.1 55.6 114.5 136.9 114.5 136.9 48.8 14.8 90.7 45.6 119.2 86.4 96 137.3 21.5 350.6-228.6 350.6zM514.2 335.8c0.2 0 0.3 0.1 0.5 0.1s0.3-0.1 0.5-0.1h-1z m177.1 421.1c0-17.5-45.8-17.3-63.3 0.1l-32.8 32.9c-14.1 14.1-38.2 4.2-38.2-15.8V380.6c0-24.5-17.9-44.4-42.3-44.7-24.5 0.3-47.2 20.1-47.2 44.7v393.5c0 19.9-24.1 29.9-38.2 15.8l-32.8-42.1c-17.5-17.5-45.3-9.3-62.8-9.3h-0.2c-17.5 44.8-17.6 55.1-0.1 72.6L449 931.5c35 35 91.6 37.3 126.6 2.3l115.7-114.6c17.5-17.5 0-45.2 0-62.7v0.4z"/></svg>
                </a>
            `;
            return div;
        }

        function doSearch(term) {
            if (term === lastQuery) return;
            lastQuery = term;

            if (term === '') {
                gameResult.classList.remove('show');
                noResult.classList.remove('show');
                gameResult.innerHTML = '';
                return;
            }

            const found = gamedataIndexed.filter(g => g._title_lc.includes(term));

            if (found.length > 0) {
                // Use DocumentFragment to batch DOM writes
                const frag = document.createDocumentFragment();
                found.forEach(g => frag.appendChild(buildGameCard(g)));
                gameResult.innerHTML = '';
                gameResult.appendChild(frag);
                gameResult.classList.add('show');
                noResult.classList.remove('show');
            } else {
                gameResult.classList.remove('show');
                gameResult.innerHTML = '';
                noResult.classList.add('show');
            }
        }

        searchInput.addEventListener('input', function () {
            const term = this.value.trim().toLowerCase();
            clearTimeout(debounceTimer);
            // Debounce: wait 200ms after user stops typing
            debounceTimer = setTimeout(() => doSearch(term), 200);
        });

        // ── FEATURED MARQUEE ──
        const marqueeTrack = document.getElementById('marqueeTrack');
        // Use featured array, fallback to data if empty
        const marqueeSource = (typeof featured !== 'undefined' && featured.length > 0) ? featured : data.slice(0, 20);

        // Build items x2 for seamless loop
        const buildItems = () => {
            const frag = document.createDocumentFragment();
            [...marqueeSource, ...marqueeSource].forEach(game => {
                const btn = document.createElement('button');
                btn.className = 'marquee-item';
                btn.title = game.title;
                btn.style.background = 'none';
                btn.style.cursor = 'pointer';
                btn.innerHTML = `<img src="${game.image}" alt="${game.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/48'">`;
                btn.addEventListener('click', () => {
                    // Điền tên vào search input
                    searchInput.value = game.title;
                    // Scroll lên search để thấy kết quả
                    searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    // Trigger search
                    lastQuery = '';
                    doSearch(game.title.toLowerCase());
                });
                frag.appendChild(btn);
            });
            marqueeTrack.appendChild(frag);
        };
        buildItems();

        // ── THEME TOGGLE ──
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        const html = document.documentElement;

        // Default: light mode
        let isDark = false;

        toggle.addEventListener('click', () => {
            isDark = !isDark;
            if (isDark) {
                html.setAttribute('data-theme', 'dark');
                icon.className = 'fas fa-moon';
            } else {
                html.removeAttribute('data-theme');
                icon.className = 'fas fa-sun';
            }
        });
    </script>

</body>

</html>
