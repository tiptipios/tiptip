<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Tip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            overflow-y: auto;
            background: linear-gradient(135deg, #0f0a1e 0%, #1a0b2e 25%, #2d1b3d 50%, #1e0f3b 75%, #0a0614 100%);
            padding: 20px 0;
        }

        /* ── LIQUID GLASS BACKGROUND ── */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        /* Liquid Glass floating bubbles */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float-liquid 25s linear infinite;
            will-change: transform;
            pointer-events: none;
        }

        .orb-1 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle at 30% 30%,
                    rgba(124, 58, 237, 0.35) 0%,
                    transparent 70%);
            top: -120px;
            left: -80px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle at 30% 30%,
                    rgba(219, 39, 119, 0.3) 0%,
                    transparent 70%);
            bottom: -100px;
            right: -60px;
            animation-duration: 30s;
            animation-direction: reverse;
        }

        .orb-3 {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle at 30% 30%,
                    rgba(59, 130, 246, 0.25) 0%,
                    transparent 70%);
            top: 45%;
            left: 55%;
            animation-duration: 22s;
        }

        .orb-4 {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle at 30% 30%,
                    rgba(52, 211, 153, 0.2) 0%,
                    transparent 70%);
            top: 20%;
            right: 15%;
            animation-duration: 28s;
        }

        @keyframes float-liquid {
            0% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(30px, -25px);
            }

            66% {
                transform: translate(-20px, 20px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* Glass reflection effect */
        .grid-lines {
            display: none;
        }

        /* ── LIQUID GLASS CARD ── */
        .card {
            position: relative;
            z-index: 1;
            width: calc(100% - 32px);
            max-width: 400px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08) 0%,
                    rgba(255, 255, 255, 0.05) 50%,
                    rgba(255, 255, 255, 0.07) 100%);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border-radius: 32px;
            padding: 44px 28px 40px;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.1) inset,
                0 40px 80px rgba(0, 0, 0, 0.5),
                0 20px 60px rgba(124, 58, 237, 0.2);
            animation: rise 0.6s cubic-bezier(.22, 1, .36, 1) both;
            overflow: hidden;
            will-change: transform;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Card glow - static, no animation */
        .card::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: linear-gradient(135deg,
                    rgba(124, 58, 237, 0.3),
                    rgba(219, 39, 119, 0.3),
                    rgba(59, 130, 246, 0.3));
            border-radius: 32px;
            z-index: -1;
            filter: blur(15px);
            opacity: 0.4;
        }

        /* ── LIQUID GLASS AVATAR ── */
        .avatar-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 22px;
        }

        .avatar-ring {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg,
                    rgba(124, 58, 237, 0.8),
                    rgba(219, 39, 119, 0.8),
                    rgba(59, 130, 246, 0.8),
                    rgba(52, 211, 153, 0.8));
            box-shadow:
                0 0 40px rgba(124, 58, 237, 0.5),
                0 0 60px rgba(219, 39, 119, 0.3),
                0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Liquid outer glow */
        .avatar-ring::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle,
                    rgba(124, 58, 237, 0.4),
                    rgba(219, 39, 119, 0.3),
                    transparent);
            filter: blur(20px);
            z-index: -1;
        }

        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(145deg,
                    rgba(20, 20, 30, 0.8),
                    rgba(30, 20, 40, 0.6));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 0 20px rgba(0, 0, 0, 0.5) inset,
                0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .avatar-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Liquid online dot */
        .online-dot {
            position: absolute;
            bottom: 6px;
            right: 6px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #10b981, #34d399);
            border: 3px solid rgba(20, 20, 30, 0.9);
            border-radius: 50%;
            box-shadow:
                0 0 15px rgba(16, 185, 129, 0.8),
                0 0 30px rgba(16, 185, 129, 0.4),
                0 3px 10px rgba(0, 0, 0, 0.5);
            animation: liquid-ping 2s ease-in-out infinite;
        }

        @keyframes liquid-ping {

            0%,
            100% {
                transform: scale(1);
                box-shadow:
                    0 0 15px rgba(16, 185, 129, 0.8),
                    0 0 30px rgba(16, 185, 129, 0.4),
                    0 3px 10px rgba(0, 0, 0, 0.5);
            }

            50% {
                transform: scale(1.1);
                box-shadow:
                    0 0 25px rgba(16, 185, 129, 1),
                    0 0 50px rgba(16, 185, 129, 0.6),
                    0 3px 10px rgba(0, 0, 0, 0.5);
            }
        }

        /* ── LIQUID GLASS NAME ── */
        h1 {
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -0.8px;
            background: linear-gradient(135deg,
                    #ffffff 0%,
                    #e0d4ff 25%,
                    #ffd4e8 50%,
                    #d4efff 75%,
                    #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            filter: drop-shadow(0 2px 8px rgba(124, 58, 237, 0.4));
            position: relative;
            z-index: 2;
        }

        .sub-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            margin-bottom: 32px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        /* ── LIQUID DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.15) 20%,
                    rgba(124, 58, 237, 0.3) 50%,
                    rgba(255, 255, 255, 0.15) 80%,
                    transparent);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(124, 58, 237, 0.2);
        }

        .divider span {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            white-space: nowrap;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.1),
                    rgba(255, 255, 255, 0.05));
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* ── LIQUID GLASS BUTTONS ── */
        .channels {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            gap: 0;
            border-radius: 20px;
            text-decoration: none !important;
            color: #fff !important;
            border: 2px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .btn:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn:active {
            transform: translateY(-2px) scale(1);
        }

        /* Liquid glass reflection overlay */
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.15) 0%,
                    transparent 100%);
            pointer-events: none;
            z-index: 1;
        }

        /* Liquid shine sweep */
        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.25) 50%,
                    transparent 70%);
            transform: translateX(-100%) skewX(-15deg);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
        }

        .btn:hover::after {
            transform: translateX(100%) skewX(-15deg);
        }

        /* icon col */
        .btn .icon-col {
            width: 60px;
            min-width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
            position: relative;
            z-index: 3;
        }

        /* text col */
        .btn .text-col {
            flex: 1;
            padding: 0 16px;
            text-align: left;
            position: relative;
            z-index: 3;
        }

        .btn .btn-name {
            display: block;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .btn .btn-desc {
            display: block;
            font-size: 11px;
            opacity: 0.8;
            margin-top: 3px;
            font-weight: 500;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        /* arrow col */
        .btn .arrow-col {
            width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            opacity: 0.6;
            position: relative;
            z-index: 3;
            transition: transform 0.3s ease;
        }

        .btn:hover .arrow-col {
            transform: translateX(4px);
            opacity: 1;
        }

        /* Liquid glass colors */
        .btn-tg-main {
            background: linear-gradient(135deg,
                    rgba(0, 152, 221, 0.4) 0%,
                    rgba(0, 111, 163, 0.3) 100%);
            box-shadow:
                0 10px 30px rgba(0, 152, 221, 0.25),
                0 0 40px rgba(0, 152, 221, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .btn-tg-main:hover {
            box-shadow:
                0 15px 40px rgba(0, 152, 221, 0.35),
                0 0 60px rgba(0, 152, 221, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        .btn-tg-spike {
            background: linear-gradient(135deg,
                    rgba(124, 58, 237, 0.4) 0%,
                    rgba(91, 33, 182, 0.3) 100%);
            box-shadow:
                0 10px 30px rgba(124, 58, 237, 0.25),
                0 0 40px rgba(124, 58, 237, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .btn-tg-spike:hover {
            box-shadow:
                0 15px 40px rgba(124, 58, 237, 0.35),
                0 0 60px rgba(124, 58, 237, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        .btn-tg-ff {
            background: linear-gradient(135deg,
                    rgba(244, 63, 94, 0.4) 0%,
                    rgba(190, 18, 60, 0.3) 100%);
            box-shadow:
                0 10px 30px rgba(244, 63, 94, 0.25),
                0 0 40px rgba(244, 63, 94, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .btn-tg-ff:hover {
            box-shadow:
                0 15px 40px rgba(244, 63, 94, 0.35),
                0 0 60px rgba(244, 63, 94, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        .btn-discord {
            background: linear-gradient(135deg,
                    rgba(88, 101, 242, 0.4) 0%,
                    rgba(59, 77, 209, 0.3) 100%);
            box-shadow:
                0 10px 30px rgba(88, 101, 242, 0.25),
                0 0 40px rgba(88, 101, 242, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        .btn-discord:hover {
            box-shadow:
                0 15px 40px rgba(88, 101, 242, 0.35),
                0 0 60px rgba(88, 101, 242, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        }

        /* staggered liquid entrance */
        .btn:nth-child(1) {
            animation: rise 0.7s 0.12s both;
        }

        .btn:nth-child(2) {
            animation: rise 0.7s 0.22s both;
        }

        .btn:nth-child(3) {
            animation: rise 0.7s 0.32s both;
        }

        .btn:nth-child(4) {
            animation: rise 0.7s 0.42s both;
        }

        /* ── LIQUID FOOTER ── */
        .foot {
            margin-top: 32px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 2;
        }

        .foot .heart {
            display: inline-block;
            color: #ff6b9d;
            animation: liquid-hb 1.4s ease infinite;
            filter: drop-shadow(0 0 8px rgba(255, 107, 157, 0.6));
        }

        @keyframes liquid-hb {

            0%,
            100% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.35);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.2);
            }
        }

        /* ── SEARCH CARD ── */
        .search-section {
            margin-bottom: 24px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 46px 14px 18px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .search-input:focus {
            border-color: rgba(124, 58, 237, 0.6);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.3);
        }

        .search-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            pointer-events: none;
        }

        .game-result {
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: fadeIn 0.4s ease;
        }

        .game-result.show {
            display: flex;
        }

        .game-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.08),
                    rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 12px;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
        }

        .game-item:hover {
            border-color: rgba(124, 58, 237, 0.4);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.2);
        }

        .game-image {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .game-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            min-width: 0;
        }

        .game-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .game-meta {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            padding: 0;
            background: rgba(255, 255, 255, 0.15);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            border-radius: 50%;
            color: #fff !important;
            text-decoration: none !important;
            transition: all 0.15s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
            backdrop-filter: blur(10px);
        }

        .download-btn svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .download-btn:active {
            transform: translateY(1px);
            background: rgba(255, 255, 255, 0.1);
        }

        .no-result {
            display: none;
            text-align: center;
            padding: 20px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
        }

        .no-result.show {
            display: block;
        }
    </style>
</head>

<body>

    <!-- Background -->
    <div class="bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="grid-lines"></div>
    </div>

    <!-- Card -->
    <div class="card">

        <!-- Avatar -->
        <div class="avatar-wrap">
            <div class="avatar-ring">
                <div class="avatar-inner">
                    <img src="https://bio.linkcdn.cc/upload/2024040505/171229360600038148.jpg" alt="Tip Tip">
                </div>
            </div>
            <div class="online-dot"></div>
        </div>

        <!-- Name -->
        <h1>Tip Tip</h1>
        <p class="sub-label"> </p>

        <!-- Search Section -->
        <div class="search-section">
            <div class="divider"><span>Search iOS Games</span></div>

            <div class="search-box">
                <input type="text" class="search-input" id="gameSearch" placeholder="Enter game name..."
                    autocomplete="off">
                <i class="fas fa-search search-icon"></i>
            </div>

            <div class="game-result" id="gameResult">
                <!-- Game items will be inserted here dynamically -->
            </div>

            <div class="no-result" id="noResult">
                <i class="fas fa-search" style="font-size: 24px; margin-bottom: 8px; opacity: 0.3;"></i>
                <div>No games found</div>
            </div>
        </div>

        <!-- Divider -->
        <div class="divider"><span>Join Our Channels</span></div>

        <!-- Channels -->
        <div class="channels">

            <a href="https://t.me/gamemodios" class="btn btn-tg-main" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name"> Telegram Channel</span>
                    <span class="btn-desc">Games, Apps, IPA </span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://t.me/modspike" class="btn btn-tg-spike" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name">The Spike Channel</span>
                    <span class="btn-desc">The Spike Cross</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://t.me/freefiretiptip" class="btn btn-tg-ff" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-telegram-plane"></i></div>
                <div class="text-col">
                    <span class="btn-name">FreeFire Channel</span>
                    <span class="btn-desc">Free Fire Updates</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

            <a href="https://discord.gg/p7P4KqhPZg" class="btn btn-discord" target="_blank" rel="noopener">
                <div class="icon-col"><i class="fab fa-discord"></i></div>
                <div class="text-col">
                    <span class="btn-name">Discord</span>
                    <span class="btn-desc">Join our community</span>
                </div>
                <div class="arrow-col"><i class="fas fa-chevron-right"></i></div>
            </a>

        </div>

        <!-- Footer -->
        <p class="foot">Made with <span class="heart">♥</span> by Tip Tip · 2026</p>

    </div>

    <script src="../js/tiptip.js"></script>
    <script>
        const searchInput = document.getElementById('gameSearch');
        const gameResult = document.getElementById('gameResult');
        const noResult = document.getElementById('noResult');

        // Pre-build lowercase title index for fast lookup
        const gamedataIndexed = gamedata.map(g => ({
            ...g,
            _title_lc: g.title.toLowerCase()
        }));

        let debounceTimer = null;
        let lastQuery = '';

        function buildGameCard(game) {
            const downloadUrl = `download.html?title=${encodeURIComponent(game.title)}&image=${encodeURIComponent(game.image)}&description=${encodeURIComponent(game.description || '')}&version=${encodeURIComponent(game.version)}&size=${encodeURIComponent(game.size)}&url=${encodeURIComponent(game.download_url)}`;

            const div = document.createElement('div');
            div.className = 'game-item';
            div.innerHTML = `
                <img src="${game.image}" alt="${game.title}" class="game-image" loading="lazy" onerror="this.src='https://via.placeholder.com/80'">
                <div class="game-info">
                    <div class="game-title">${game.title}</div>
                    <div class="game-meta">v${game.version} • ${game.size}</div>
                </div>
                <a href="${downloadUrl}" class="download-btn" title="Download">
                    <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M691.3 693.9c-24.7 0-44.8-20-44.8-44.8 0-24.7 20-44.8 44.8-44.8h40c190.6 0 176.8-274.4 0.2-268.1C671.2 37.2 208 145.1 299 445c-93-73.9-204.6 69.2-109.6 139.8 67.2 49.9 188.5-18.4 188.5 64.3 0 56.3-63.9 44.8-125.3 44.8-149.3 0-241.3-159.3-155.8-281.1 40.8-58.2 104.9-72.6 104.9-72.6C231.4 111.3 492.7-9.5 686.2 120c83.1 55.6 114.5 136.9 114.5 136.9 48.8 14.8 90.7 45.6 119.2 86.4 96 137.3 21.5 350.6-228.6 350.6zM514.2 335.8c0.2 0 0.3 0.1 0.5 0.1s0.3-0.1 0.5-0.1h-1z m177.1 421.1c0-17.5-45.8-17.3-63.3 0.1l-32.8 32.9c-14.1 14.1-38.2 4.2-38.2-15.8V380.6c0-24.5-17.9-44.4-42.3-44.7-24.5 0.3-47.2 20.1-47.2 44.7v393.5c0 19.9-24.1 29.9-38.2 15.8l-32.8-42.1c-17.5-17.5-45.3-9.3-62.8-9.3h-0.2c-17.5 44.8-17.6 55.1-0.1 72.6L449 931.5c35 35 91.6 37.3 126.6 2.3l115.7-114.6c17.5-17.5 0-45.2 0-62.7v0.4z"/></svg>
                </a>
            `;
            return div;
        }

        function doSearch(term) {
            if (term === lastQuery) return;
            lastQuery = term;

            if (term === '') {
                gameResult.classList.remove('show');
                noResult.classList.remove('show');
                gameResult.innerHTML = '';
                return;
            }

            const found = gamedataIndexed.filter(g => g._title_lc.includes(term));

            if (found.length > 0) {
                // Use DocumentFragment to batch DOM writes
                const frag = document.createDocumentFragment();
                found.forEach(g => frag.appendChild(buildGameCard(g)));
                gameResult.innerHTML = '';
                gameResult.appendChild(frag);
                gameResult.classList.add('show');
                noResult.classList.remove('show');
            } else {
                gameResult.classList.remove('show');
                gameResult.innerHTML = '';
                noResult.classList.add('show');
            }
        }

        searchInput.addEventListener('input', function () {
            const term = this.value.trim().toLowerCase();
            clearTimeout(debounceTimer);
            // Debounce: wait 200ms after user stops typing
            debounceTimer = setTimeout(() => doSearch(term), 200);
        });
    </script>

</body>

</html>
