<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download - Tip Tip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00ff88;
            --secondary: #00ccff;
            --bg-dark: #0d1117;
            --bg-card: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-dim: #8b949e;
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }

        /* Matrix background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.08;
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--primary);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            z-index: 999;
        }

        .back-btn:hover {
            transform: translateX(-2px);
            background: rgba(0, 255, 136, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
        }

        /* Card */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 32px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: rise 0.5s cubic-bezier(.22, 1, .36, 1) both;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Game header */
        .game-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .game-icon {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid var(--border);
            box-shadow: 0 4px 16px rgba(0, 255, 136, 0.2);
            flex-shrink: 0;
            animation: icon-glow 3s ease-in-out infinite;
        }

        @keyframes icon-glow {

            0%,
            100% {
                box-shadow: 0 4px 16px rgba(0, 255, 136, 0.2);
            }

            50% {
                box-shadow: 0 8px 24px rgba(0, 255, 136, 0.4);
            }
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .game-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            color: var(--primary);
        }

        /* Unlock section */
        .unlock-section {
            margin-bottom: 20px;
        }

        /* Action buttons */
        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-unlock {
            background: var(--primary);
            color: var(--bg-dark);
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
        }

        .btn-unlock:hover {
            background: var(--secondary);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 255, 136, 0.6);
        }

        .btn-unlock:active {
            transform: translateY(0);
        }

        .btn-unlock:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download {
            background: var(--secondary);
            color: var(--bg-dark);
            box-shadow: 0 4px 20px rgba(0, 204, 255, 0.4);
            display: none;
        }

        .btn-download.show {
            display: flex;
            animation: rise 0.4s cubic-bezier(.22, 1, .36, 1) both;
        }

        .btn-download:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 204, 255, 0.6);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        /* Features */
        .features-section {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .features-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .features-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .features-list::-webkit-scrollbar {
            width: 4px;
        }

        .features-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .features-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
            transition: all 0.2s ease;
        }

        .feature-item:hover {
            border-color: var(--primary);
            color: var(--text);
            background: rgba(0, 255, 136, 0.05);
        }

        .feature-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .feature-dot i {
            font-size: 9px;
            color: var(--primary);
        }

        /* Note */
        .note {
            margin-top: 18px;
            padding: 12px 16px;
            background: rgba(0, 204, 255, 0.08);
            border: 1px solid rgba(0, 204, 255, 0.2);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.5;
        }

        .note i {
            color: var(--secondary);
            margin-top: 1px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <!-- Matrix Background -->
    <canvas id="matrix-canvas"></canvas>

    <a href="profil.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

    <div class="card">

        <!-- Game Header -->
        <div class="game-header">
            <img id="gameIcon" class="game-icon" src="" alt="Game">
            <div class="game-info">
                <div id="gameTitle" class="game-title">Loading...</div>
                <div class="game-badges">
                    <span class="badge"><i class="fas fa-code-branch"></i> <span id="gameVersion">-</span></span>
                    <span class="badge"><i class="fas fa-weight-hanging"></i> <span id="gameSize">-</span></span>
                </div>
            </div>
        </div>

        <!-- Unlock / Download -->
        <div class="unlock-section">
            <button id="unlockBtn" class="action-btn btn-unlock">
                <i class="fas fa-lock"></i>
                <span>Unlock Download</span>
            </button>
            <button id="downloadBtn" class="action-btn btn-download">
                <i class="fas fa-unlock"></i>
                <span>Download Now</span>
            </button>
        </div>

        <!-- Features -->
        <div class="features-section" id="featuresSection" style="display:none">
            <div class="features-title"> Features</div>
            <div class="features-list" id="featuresList"></div>
        </div>

        <!-- Note -->
        <div class="note">
            <i class="fas fa-lightbulb"></i>
            <span>If the link is overloaded, please log in to Google Drive on Safari before downloading.</span>
        </div>

    </div>

    <script>
        // ── PARAMS ──
        const p = new URLSearchParams(window.location.search);
        const gameTitle = p.get('title') || 'Game';
        const gameImage = p.get('image') || '';
        const gameVersion = p.get('version') || '?';
        const gameSize = p.get('size') || '?';
        const downloadUrl = p.get('url') || '#';
        const description = p.get('description') || '';

        document.getElementById('gameTitle').textContent = gameTitle;
        document.getElementById('gameIcon').src = gameImage;
        document.getElementById('gameVersion').textContent = 'v' + gameVersion;
        document.getElementById('gameSize').textContent = gameSize;

        document.getElementById('gameIcon').onerror = function () {
            this.src = 'https://via.placeholder.com/80/6366f1/ffffff?text=Game';
        };

        // ── FEATURES ──
        if (description) {
            const features = description.split('\n')
                .map(l => l.trim())
                .filter(l => l.length > 0 && l.startsWith('✅'));

            if (features.length > 0) {
                document.getElementById('featuresSection').style.display = 'block';
                const list = document.getElementById('featuresList');
                const frag = document.createDocumentFragment();
                features.forEach(f => {
                    const text = f.replace('✅', '').trim();
                    const div = document.createElement('div');
                    div.className = 'feature-item';
                    div.innerHTML = `<div class="feature-dot"><i class="fas fa-check"></i></div><span>${text}</span>`;
                    frag.appendChild(div);
                });
                list.appendChild(frag);
            }
        }

        // ── UNLOCK → ADS → DOWNLOAD ──
        const unlockBtn = document.getElementById('unlockBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        unlockBtn.addEventListener('click', () => {
            unlockBtn.disabled = true;
            unlockBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading ads...</span>';

            window.open('https://t.me/gamemodios', '_blank');

            setTimeout(() => {
                unlockBtn.style.display = 'none';
                downloadBtn.classList.add('show');
            }, 1000);
        });

        downloadBtn.addEventListener('click', () => {
            window.location.href = 'https://vuotlink.net/st?api=4e2b672bf2a8ba8ead742b4f9c07db7e690505a2&url=' + encodeURIComponent(downloadUrl);
        });

        // Matrix background
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 17, 23, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff88';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 80);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
