<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download - Tip Tip</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #f0f4ff;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(99, 102, 241, 0.15);
            --card-shadow: 0 20px 60px rgba(99, 102, 241, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --divider: rgba(99, 102, 241, 0.12);
            --item-bg: #f8fafc;
            --item-border: #e2e8f0;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-soft: rgba(99, 102, 241, 0.1);
            --green: #22c55e;
            --green-hover: #16a34a;
            --orb: #6366f1;
            --toggle-bg: #ffffff;
            --toggle-border: #e2e8f0;
            --toggle-icon: #6366f1;
        }

        [data-theme="dark"] {
            --bg: #09090b;
            --card-bg: rgba(24, 24, 27, 0.97);
            --card-border: rgba(139, 92, 246, 0.25);
            --card-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(139, 92, 246, 0.1);
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --divider: rgba(139, 92, 246, 0.2);
            --item-bg: #18181b;
            --item-border: #3f3f46;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --accent-soft: rgba(139, 92, 246, 0.15);
            --green: #22c55e;
            --green-hover: #16a34a;
            --orb: #8b5cf6;
            --toggle-bg: #27272a;
            --toggle-border: #3f3f46;
            --toggle-icon: #a78bfa;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: var(--bg);
            padding: 24px 16px;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        /* Orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: float-orb 25s linear infinite;
            will-change: transform;
        }

        .bg-orb-1 {
            width: 350px;
            height: 350px;
            background: var(--orb);
            top: -100px;
            left: -80px;
        }

        .bg-orb-2 {
            width: 280px;
            height: 280px;
            background: var(--orb);
            bottom: -80px;
            right: -60px;
            animation-direction: reverse;
            animation-duration: 30s;
        }

        @keyframes float-orb {
            0% {
                transform: translate(0, 0);
            }

            33% {
                transform: translate(25px, -20px);
            }

            66% {
                transform: translate(-15px, 18px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* Back button */
        .back-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--toggle-icon);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            z-index: 999;
        }

        .back-btn:hover {
            transform: translateX(-2px);
            background: var(--accent-soft);
            border-color: var(--accent);
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 18px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--toggle-bg);
            border: 1px solid var(--toggle-border);
            color: var(--toggle-icon);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            z-index: 999;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* Card */
        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 36px 28px 32px;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(40px);
            animation: rise 0.5s cubic-bezier(.22, 1, .36, 1) both;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.3), transparent);
            border-radius: 28px 28px 0 0;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Game header */
        .game-header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--divider);
            margin-bottom: 24px;
        }

        .game-icon {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            object-fit: cover;
            border: 2px solid var(--item-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            flex-shrink: 0;
            animation: icon-bounce 3s ease-in-out infinite;
        }

        @keyframes icon-bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .game-info {
            flex: 1;
            min-width: 0;
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .game-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            background: var(--accent-soft);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
        }

        /* Unlock section */
        .unlock-section {
            margin-bottom: 20px;
        }

        /* Action buttons */
        .action-btn {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }

        .btn-unlock {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35);
        }

        .btn-unlock:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.45);
        }

        .btn-unlock:active {
            transform: translateY(0);
        }

        .btn-unlock:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-download {
            background: var(--green);
            color: #fff;
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3);
            display: none;
        }

        .btn-download.show {
            display: flex;
            animation: rise 0.4s cubic-bezier(.22, 1, .36, 1) both;
        }

        .btn-download:hover {
            background: var(--green-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(34, 197, 94, 0.4);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        /* Features */
        .features-section {
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--divider);
        }

        .features-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .features-list {
            max-height: 220px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }

        .features-list::-webkit-scrollbar {
            width: 4px;
        }

        .features-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .features-list::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 4px;
        }

        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: var(--item-bg);
            border: 1px solid var(--item-border);
            border-radius: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.5;
            transition: all 0.2s ease;
        }

        .feature-item:hover {
            border-color: var(--accent);
            color: var(--text-primary);
        }

        .feature-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-soft);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .feature-dot i {
            font-size: 9px;
            color: var(--accent);
        }

        /* Note */
        .note {
            margin-top: 18px;
            padding: 12px 16px;
            background: rgba(234, 179, 8, 0.08);
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 14px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: flex-start;
            gap: 8px;
            line-height: 1.5;
        }

        .note i {
            color: #eab308;
            margin-top: 1px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>

    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>

    <a href="profilenew.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

    <button class="theme-toggle" id="themeToggle"><i class="fas fa-sun" id="themeIcon"></i></button>

    <div class="card">

        <!-- Game Header -->
        <div class="game-header">
            <img id="gameIcon" class="game-icon" src="" alt="Game">
            <div class="game-info">
                <div id="gameTitle" class="game-title">Loading...</div>
                <div class="game-badges">
                    <span class="badge"><i class="fas fa-code-branch"></i> <span id="gameVersion">-</span></span>
                    <span class="badge"><i class="fas fa-weight-hanging"></i> <span id="gameSize">-</span></span>
                </div>
            </div>
        </div>

        <!-- Unlock / Download -->
        <div class="unlock-section">
            <button id="unlockBtn" class="action-btn btn-unlock">
                <i class="fas fa-lock"></i>
                <span>Unlock Download</span>
            </button>
            <button id="downloadBtn" class="action-btn btn-download">
                <i class="fas fa-unlock"></i>
                <span>Download Now</span>
            </button>
        </div>

        <!-- Features -->
        <div class="features-section" id="featuresSection" style="display:none">
            <div class="features-title"> Features</div>
            <div class="features-list" id="featuresList"></div>
        </div>

        <!-- Note -->
        <div class="note">
            <i class="fas fa-lightbulb"></i>
            <span>If the link is overloaded, please log in to Google Drive on Safari before downloading.</span>
        </div>

    </div>

    <script>
        // ── PARAMS ──
        const p = new URLSearchParams(window.location.search);
        const gameTitle = p.get('title') || 'Game';
        const gameImage = p.get('image') || '';
        const gameVersion = p.get('version') || '?';
        const gameSize = p.get('size') || '?';
        const downloadUrl = p.get('url') || '#';
        const description = p.get('description') || '';

        document.getElementById('gameTitle').textContent = gameTitle;
        document.getElementById('gameIcon').src = gameImage;
        document.getElementById('gameVersion').textContent = 'v' + gameVersion;
        document.getElementById('gameSize').textContent = gameSize;

        document.getElementById('gameIcon').onerror = function () {
            this.src = 'https://via.placeholder.com/80/6366f1/ffffff?text=Game';
        };

        // ── FEATURES ──
        if (description) {
            const features = description.split('\n')
                .map(l => l.trim())
                .filter(l => l.length > 0 && l.startsWith('✅'));

            if (features.length > 0) {
                document.getElementById('featuresSection').style.display = 'block';
                const list = document.getElementById('featuresList');
                const frag = document.createDocumentFragment();
                features.forEach(f => {
                    const text = f.replace('✅', '').trim();
                    const div = document.createElement('div');
                    div.className = 'feature-item';
                    div.innerHTML = `<div class="feature-dot"><i class="fas fa-check"></i></div><span>${text}</span>`;
                    frag.appendChild(div);
                });
                list.appendChild(frag);
            }
        }

        // ── UNLOCK → ADS → DOWNLOAD ──
        const unlockBtn = document.getElementById('unlockBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        unlockBtn.addEventListener('click', () => {
            unlockBtn.disabled = true;
            unlockBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Loading ads...</span>';

            window.open('https://s.shopee.vn/7VELJqmITK', '_blank');

            setTimeout(() => {
                unlockBtn.style.display = 'none';
                downloadBtn.classList.add('show');
            }, 1000);
        });

        downloadBtn.addEventListener('click', () => {
            window.location.href = 'https://vuotlink.net/st?api=4e2b672bf2a8ba8ead742b4f9c07db7e690505a2&url=' + encodeURIComponent(downloadUrl);
        });

        // ── THEME TOGGLE ──
        const toggle = document.getElementById('themeToggle');
        const icon = document.getElementById('themeIcon');
        let isDark = false;

        toggle.addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
            icon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        });
    </script>
</body>

</html>
